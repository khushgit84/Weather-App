<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyPulse — Weather Dashboard</title>
  <meta name="description" content="A beautiful weather dashboard with animated backgrounds, hourly forecasts, and detailed weather metrics." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-atmosphere">
    <div class="atmo-layer atmo-1"></div>
    <div class="atmo-layer atmo-2"></div>
    <div class="atmo-layer atmo-3"></div>
  </div>

  <div class="app">
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/></svg>
        <h1>SkyPulse</h1>
      </div>
    </header>

    <!-- Search -->
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Search any city..." autocomplete="off" />
      <button id="btn-search" class="btn-search">Go</button>
    </div>

    <!-- Main Weather Card -->
    <div class="main-card" id="main-card">
      <div class="weather-icon-wrap">
        <div class="weather-icon" id="weather-icon">☀️</div>
      </div>
      <div class="temp-wrap">
        <span class="temp" id="temp">24°</span>
        <span class="condition" id="condition">Sunny</span>
      </div>
      <div class="location-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="location">New Delhi, India</span>
      </div>
      <div class="date-wrap" id="date-display"></div>
    </div>

    <!-- Metrics Grid -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-icon">💨</div>
        <span class="metric-val" id="wind">12 km/h</span>
        <span class="metric-lbl">Wind</span>
      </div>
      <div class="metric-card">
        <div class="metric-icon">💧</div>
        <span class="metric-val" id="humidity">65%</span>
        <span class="metric-lbl">Humidity</span>
      </div>
      <div class="metric-card">
        <div class="metric-icon">👁️</div>
        <span class="metric-val" id="visibility">10 km</span>
        <span class="metric-lbl">Visibility</span>
      </div>
      <div class="metric-card">
        <div class="metric-icon">🌡️</div>
        <span class="metric-val" id="feels-like">26°</span>
        <span class="metric-lbl">Feels Like</span>
      </div>
      <div class="metric-card">
        <div class="metric-icon">📊</div>
        <span class="metric-val" id="pressure">1013 hPa</span>
        <span class="metric-lbl">Pressure</span>
      </div>
      <div class="metric-card">
        <div class="metric-icon">🌅</div>
        <span class="metric-val" id="uv-index">5</span>
        <span class="metric-lbl">UV Index</span>
      </div>
    </div>

    <!-- 5-Day Forecast -->
    <div class="forecast-section">
      <h2 class="section-title">5-Day Forecast</h2>
      <div class="forecast-cards" id="forecast-cards"></div>
    </div>

    <!-- Hourly Chart -->
    <div class="hourly-section">
      <h2 class="section-title">Today's Temperature</h2>
      <div class="hourly-chart" id="hourly-chart"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
